---
zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1001
    name: Templates/Synology
  templates:
  - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1002
    template: Template Synology Active Backup Zabbix Sender
    name: Template Synology Active Backup Zabbix Sender
    description: Monitors Synology Active Backup via active pushes from the synology-activebackup-zabbix
      DSM package to Zabbix trapper items.
    vendor:
      name: pthoelken
      version: 0.1.15
    groups:
    - name: Templates/Synology
    items:
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1101
      name: Active Backup collector health
      type: TRAP
      key: synology.activebackup.health
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      valuemap:
        name: Active Backup Health
      tags:
      - tag: component
        value: collector
      triggers:
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1201
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.health)=0
        name: 'Active Backup: Collector Fehler'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1204
        expression: nodata(/Template Synology Active Backup Zabbix Sender/synology.activebackup.health,{$ACTIVEBACKUP.NO_DATA_PERIOD})=1
        name: 'Active Backup: Keine Werte empfangen'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1102
      name: Active Backup collector health JSON
      type: TRAP
      key: synology.activebackup.health.json
      delay: '0'
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: collector
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1103
      name: Active Backup for Business database missing
      type: TRAP
      key: synology.activebackup.product.db_missing[abb]
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: database
      - tag: product
        value: abb
      triggers:
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1202
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.product.db_missing[abb])=1
        name: 'Active Backup for Business: Datenbank nicht gefunden'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1104
      name: Active Backup for Microsoft 365 database missing
      type: TRAP
      key: synology.activebackup.product.db_missing[m365]
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: database
      - tag: product
        value: m365
      triggers:
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1203
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.product.db_missing[m365])=1
        name: 'Active Backup for Microsoft 365: Datenbank nicht gefunden'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1105
      name: Active Backup successful jobs
      type: TRAP
      key: synology.activebackup.jobs.successful
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: summary
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1106
      name: Active Backup failed jobs
      type: TRAP
      key: synology.activebackup.jobs.failed
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: summary
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1107
      name: Active Backup jobs with warning or error
      type: TRAP
      key: synology.activebackup.jobs.problem
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: summary
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df1108
      name: Active Backup total jobs
      type: TRAP
      key: synology.activebackup.jobs.total
      delay: '0'
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: summary
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    discovery_rules:
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2001
      name: Active Backup Discovery
      type: TRAP
      key: synology.activebackup.discovery
      delay: '0'
      lifetime: 7d
      item_prototypes:
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2101
        name: Backup status [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.status[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Active Backup Status
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2102
        name: Backup age [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.age[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        units: s
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2103
        name: Backup last successful age [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.last_success_age[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        units: s
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2104
        name: Backup error code [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.error[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: '0'
        value_type: TEXT
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2105
        name: Backup runtime [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.runtime[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        units: s
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2106
        name: Backup transferred size [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.transferred_size[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        units: B
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2107
        name: Backup last end time [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.last_end_time[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        units: unixtime
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2108
        name: Backup info [{#PRODUCT}] {#JOBNAME}
        type: TRAP
        key: synology.activebackup.job.info[{#PRODUCT},{#TASKID}]
        delay: '0'
        history: 7d
        trends: '0'
        value_type: TEXT
        tags:
        - tag: component
          value: backup
        - tag: product
          value: "{#PRODUCT}"
        allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      trigger_prototypes:
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2201
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.status[{#PRODUCT},{#TASKID}])=6
          or last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.status[{#PRODUCT},{#TASKID}])=10
        name: 'Backup fehlgeschlagen: [{#PRODUCT}] {#JOBNAME}'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2204
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.status[{#PRODUCT},{#TASKID}])=2
        name: 'Backup Warnung: [{#PRODUCT}] {#JOBNAME}'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2202
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.last_success_age[{#PRODUCT},{#TASKID}])>{$ACTIVEBACKUP.MAX_AGE_HOURS}*3600
        name: 'Backup zu alt: [{#PRODUCT}] {#JOBNAME}'
        priority: WARNING
        tags:
        - tag: scope
          value: capacity
      - uuid: 7abf2d51f3c54c2c8f4d71b8e7df2203
        expression: last(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.status[{#PRODUCT},{#TASKID}])=8
          or nodata(/Template Synology Active Backup Zabbix Sender/synology.activebackup.job.status[{#PRODUCT},{#TASKID}],15m)=1
        name: 'Keine Laufdaten vorhanden: [{#PRODUCT}] {#JOBNAME}'
        priority: WARNING
        tags:
        - tag: scope
          value: availability
      allowed_hosts: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
    tags:
    - tag: class
      value: backup
    - tag: target
      value: synology
    macros:
    - macro: "{$ACTIVEBACKUP.SENDER.ALLOWED_HOSTS}"
      value: "{HOST.CONN}"
      description: NAS address or DNS name allowed to send trapper values. Usually
        the host interface address Zabbix sees.
      config:
        type: TEXT
        priority: '1'
        section_name: Sender
        label: Allowed sender hosts
    - macro: "{$ACTIVEBACKUP.MAX_AGE_HOURS}"
      value: '30'
      description: Maximum age in hours for the last successful backup run.
      config:
        type: TEXT
        priority: '2'
        section_name: Thresholds
        label: Maximum backup age in hours
        regex: "^[0-9]+$"
    - macro: "{$ACTIVEBACKUP.NO_DATA_PERIOD}"
      value: 30m
      description: Alarm period when no Active Backup values are received.
      config:
        type: TEXT
        priority: '3'
        section_name: Thresholds
        label: No data alarm period
        regex: "^[0-9]+[smhdw]$"
    dashboards:
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df4001
      name: Active Backup
      pages:
      - name: Overview
        widgets:
        - type: item
          name: Successful jobs
          x: '0'
          y: '0'
          width: '18'
          height: '4'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.jobs.successful
          - type: STRING
            name: reference
            value: SABSJ
        - type: item
          name: Failed jobs
          x: '18'
          y: '0'
          width: '18'
          height: '4'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.jobs.failed
          - type: STRING
            name: reference
            value: SABFJ
        - type: item
          name: Jobs with warning or error
          x: '36'
          y: '0'
          width: '18'
          height: '4'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.jobs.problem
          - type: STRING
            name: reference
            value: SABPJ
        - type: item
          name: Total jobs
          x: '54'
          y: '0'
          width: '18'
          height: '4'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.jobs.total
          - type: STRING
            name: reference
            value: SABTJ
        - type: item
          name: Backup age je Job
          x: '0'
          y: '4'
          width: '36'
          height: '6'
          fields:
          - type: ITEM_PROTOTYPE
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.job.age[{#PRODUCT},{#TASKID}]
          - type: STRING
            name: reference
            value: SABAJ
        - type: item
          name: Letzter Lauf je Job
          x: '36'
          y: '4'
          width: '36'
          height: '6'
          fields:
          - type: ITEM_PROTOTYPE
            name: itemid.0
            value:
              host: Template Synology Active Backup Zabbix Sender
              key: synology.activebackup.job.last_end_time[{#PRODUCT},{#TASKID}]
          - type: STRING
            name: reference
            value: SABLR
    valuemaps:
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df5001
      name: Active Backup Status
      mappings:
      - value: '1'
        newvalue: OK
      - value: '2'
        newvalue: Warning
      - value: '3'
        newvalue: Running
      - value: '6'
        newvalue: Failed
      - value: '8'
        newvalue: No data
      - value: '9'
        newvalue: DB missing
      - value: '10'
        newvalue: Unknown
    - uuid: 7abf2d51f3c54c2c8f4d71b8e7df5002
      name: Active Backup Health
      mappings:
      - value: '0'
        newvalue: Problem
      - value: '1'
        newvalue: OK
